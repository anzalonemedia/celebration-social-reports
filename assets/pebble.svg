<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <!-- Black circle -->
  <circle cx="50" cy="50" r="50" fill="#1a1a1a"/>
  <!-- Swirl group clipped to circle -->
  <g clip-path="url(#circle-clip)">
    <!-- Main swirl: a broad S-curve stroke -->
    <path
      d="M 18 72
         C 18 72, 10 55, 22 42
         C 34 29, 55 34, 62 24
         C 70 13, 68  2, 68  2"
      fill="none"
      stroke="white"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Lower sweep of the S -->
    <path
      d="M 32 98
         C 32 98, 30 85, 38 76
         C 46 67, 65 68, 76 58
         C 87 48, 84 32, 84 32"
      fill="none"
      stroke="white"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Accent stripes — parallel lines echoing the upper curve -->
    <path
      d="M 10 76 C 10 76, 4 60, 16 47 C 26 36, 44 38, 54 28"
      fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    <path
      d="M 14 80 C 14 80, 7 63, 18 50 C 29 38, 48 42, 58 32"
      fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <!-- Accent stripes — lower curve -->
    <path
      d="M 42 100 C 40 88, 46 78, 58 68 C 70 58, 88 58, 92 42"
      fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    <path
      d="M 48 100 C 46 90, 52 80, 64 70 C 76 60, 94 60, 98 44"
      fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
